<!-- Floating Chat Button -->
<button id="btn-toggle-chat" class="hidden fixed bottom-6 left-6 z-40 items-center space-x-2 px-4 py-2.5 rounded-full bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white shadow-2xl shadow-pink-500/30 transition hover:scale-105 active:scale-95 font-semibold text-xs border border-white/20">
    <i data-lucide="message-square" class="w-4 h-4"></i>
    <span>Chat Phòng</span>
    <span id="chat-unread-badge" class="hidden bg-red-500 text-white font-bold text-[10px] px-1.5 py-0.2 rounded-full">0</span>
</button>

<!-- Chat Drawer / Panel -->
<div id="chat-drawer" class="fixed bottom-20 left-6 z-40 w-80 sm:w-96 bg-slate-900/95 border border-white/10 rounded-3xl shadow-2xl backdrop-blur-2xl flex flex-col overflow-hidden transition-all duration-300 transform scale-95 opacity-0 pointer-events-none origin-bottom-left max-h-[480px] h-[480px]">
    <!-- Chat Header -->
    <div class="flex items-center justify-between px-4 py-3 border-b border-white/10 bg-slate-950/60">
        <div class="flex items-center space-x-2">
            <div class="w-7 h-7 rounded-lg bg-pink-500/20 text-pink-400 flex items-center justify-center">
                <i data-lucide="message-square" class="w-4 h-4"></i>
            </div>
            <div>
                <h4 class="text-xs font-bold text-white flex items-center space-x-1.5">
                    <span>Trò Chuyện Phòng</span>
                    <span class="font-mono text-pink-400 text-[11px]" id="chat-room-title">#------</span>
                </h4>
                <p class="text-[9px] text-slate-400">P2P Real-time • Lưu NoSQL Local <span id="chat-msg-count" class="text-pink-400 font-semibold">(0)</span></p>
            </div>
        </div>
        <div class="flex items-center space-x-1">
            <button id="btn-clear-chat" class="p-1.5 text-slate-400 hover:text-red-400 rounded-full bg-slate-800 transition" title="Xóa lịch sử chat phòng này">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
            <button id="btn-close-chat" class="p-1.5 text-slate-400 hover:text-white rounded-full bg-slate-800 transition">
                <i data-lucide="x" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- Chat Messages Container -->
    <div id="chat-messages-container" class="flex-1 p-3 overflow-y-auto space-y-2.5 custom-scrollbar text-xs">
        <div class="text-center text-slate-500 py-10 text-[11px] italic">
            Chưa có tin nhắn nào.<br>Hãy gửi lời chào đến mọi người trong phòng!
        </div>
    </div>

    <!-- Chat Input Form -->
    <form id="chat-form" class="p-2.5 border-t border-white/10 bg-slate-950/80 flex items-center space-x-2">
        <input type="text" id="chat-input" maxlength="250" placeholder="Nhập tin nhắn..." 
               class="flex-1 px-3.5 py-2 bg-slate-900 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-pink-500">
        <button type="submit" class="p-2 bg-gradient-to-r from-pink-600 to-indigo-600 hover:from-pink-500 hover:to-indigo-500 text-white rounded-xl shadow transition shrink-0" title="Gửi">
            <i data-lucide="send" class="w-4 h-4"></i>
        </button>
    </form>
</div>
