<!-- Profile / Nickname Modal -->
<div id="profile-modal" class="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-xl hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-white/10 rounded-3xl max-w-sm w-full p-6 shadow-2xl space-y-4 relative">
        <button id="btn-close-profile-modal" class="absolute top-4 right-4 p-2 text-slate-400 hover:text-white rounded-full bg-slate-800">
            <i data-lucide="x" class="w-4 h-4"></i>
        </button>
        <div class="text-center space-y-1">
            <div id="profile-preview-avatar" class="text-4xl">🎧</div>
            <h3 class="font-bold text-base text-white">Danh Xưng Của Bạn</h3>
            <p class="text-xs text-slate-400">Tên này sẽ gắn liền với những bài hát bạn thêm</p>
        </div>
        <div class="space-y-3">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Tên hiển thị:</label>
                <div class="flex items-center space-x-2">
                    <input type="text" id="input-profile-name" maxlength="25" placeholder="Nhập tên của bạn..." class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-xl text-xs text-white focus:outline-none focus:border-pink-500">
                    <button id="btn-random-name" type="button" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold text-slate-300 shrink-0 transition" title="Random tên Anonymous">
                        🎲 Random
                    </button>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Chọn biểu tượng (Avatar):</label>
                <div id="profile-avatar-grid" class="flex flex-wrap gap-2 justify-center py-1">
                    <!-- Emoji buttons -->
                </div>
            </div>
            <button id="btn-save-profile" type="button" class="w-full py-2.5 bg-gradient-to-r from-pink-600 to-indigo-600 hover:from-pink-500 hover:to-indigo-500 rounded-xl text-xs font-bold text-white shadow-lg transition">
                Lưu Danh Xưng
            </button>
        </div>
    </div>
</div>
